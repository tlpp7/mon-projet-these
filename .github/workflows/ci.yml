name: CI Mathematical Validation

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install scipy torch matplotlib
      - name: Run Formal Invariant Tests
        run: |
          python -m unittest tests/test_mathematical_invariants.py
